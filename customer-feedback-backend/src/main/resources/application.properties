spring.application.name=pravin
server.port=8080

# MySQL database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/customer_feedback?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (authentication)
# HS256 secret - must be at least 32 chars long. Change in production!
jwt.secret=customer-feedback-app-jwt-secret-key-change-2026
# Token lifetime in milliseconds (1 hr)
jwt.expiration-ms=3600000

# Include the real error message in /error JSON responses so the frontend can
# display useful messages (e.g. "Email already registered.").
server.error.include-message=always
